<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runs Itself</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0C; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
/*
  RUNS ITSELF — a 15 s loop, 1920x1080, 120 BPM (one beat = 0.5 s, one bar = 2 s).

  Every pixel is a pure function of time. window.seek(t) clears the canvas and draws
  frame t from scratch: no CSS animation, no timers, no state carried between frames.
  Fast moves are motion-blurred inside seek(): the frame is rendered several times across
  a short shutter window and averaged, so blur length and direction follow real speed.

  Typeface: Geist (variable, 100–900), embedded at the bottom of this file (SIL OFL 1.1).
  Palette: ink + paper, orange = a human doing it by hand, lime = done automatically,
  cobalt = the system.

  ?t=3.25  shows one frame      ?play  plays in the browser with sound (click to start)
*/
"use strict";
(function () {

const W = 1920, H = 1080, DUR = 15;
const SHUTTER = 1 / 360;           // per-seek blur window; 3 subframes of this = 1/120 s (180° at 60 fps)

/* ---------------------------------------------------------------- palette */
const INK = [11, 11, 12], PAPER = [245, 245, 240], ORANGE = [255, 90, 31], LIME = [212, 255, 58], COBALT = [61, 61, 255];
const rgb = (c, a = 1) => (a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);
const mixc = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
const C = { ink: rgb(INK), paper: rgb(PAPER), orange: rgb(ORANGE), lime: rgb(LIME), cobalt: rgb(COBALT), dim: rgb(PAPER, 0.5) };
const COBALT_TONES = [rgb(COBALT), rgb(mixc(COBALT, INK, 0.3)), rgb(mixc(COBALT, INK, 0.55))];
const LIME_TONES = [rgb(LIME), rgb(mixc(LIME, INK, 0.24)), rgb(mixc(LIME, INK, 0.46))];

/* ---------------------------------------------------------------- easing (all functions of time) */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, t0, d) => clamp((t - t0) / d);
const eo = (u, k = 7) => (u <= 0 ? 0 : u >= 1 ? 1 : (1 - Math.exp(-k * u)) / (1 - Math.exp(-k)));      // exponential out
const ei = (u, k = 7) => (u <= 0 ? 0 : u >= 1 ? 1 : (Math.exp(k * u) - 1) / (Math.exp(k) - 1));         // exponential in
const eio = (u, k = 7) => (u < 0.5 ? ei(2 * u, k) / 2 : 0.5 + eo(2 * u - 1, k) / 2);                  // exponential in-out
function spr(dt, w = 16, z = 0.82) {                                                                    // damped spring, 0 → 1
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const lerpRect = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), w: lerp(a.w, b.w, u), h: lerp(a.h, b.h, u), r: lerp(a.r, b.r, u) });
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------------------------------------------------------------- recording (speed probe for motion blur) */
let REC = null;
function rec(ctx, x, y) {
  if (!REC) return;
  const m = ctx.getTransform();
  REC.push(m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f);
}

/* ---------------------------------------------------------------- type */
const REF = 100;
const mctx = document.createElement('canvas').getContext('2d');
const fnt = (w, s) => `${Math.round(w)} ${s}px Geist`;
const wq = (w) => Math.round(w / 2) * 2;
const advC = new Map(), kernC = new Map(), inkC = new Map();
function measure(str, w) { mctx.font = fnt(wq(w), REF); mctx.letterSpacing = '0px'; return mctx.measureText(str); }
function adv(ch, w, s) {
  const k = ch + '|' + wq(w);
  let v = advC.get(k);
  if (v === undefined) { v = measure(ch, w).width; advC.set(k, v); }
  return (v * s) / REF;
}
function kern(a, b, w, s) {
  const k = a + b + '|' + wq(w);
  let v = kernC.get(k);
  if (v === undefined) { v = measure(a + b, w).width - measure(a, w).width - measure(b, w).width; kernC.set(k, v); }
  return (v * s) / REF;
}
function ink(ch, w, s) {             // ink bounds relative to the glyph origin
  const k = ch + '|' + wq(w);
  let v = inkC.get(k);
  if (v === undefined) { const m = measure(ch, w); v = { l: -m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, a: m.actualBoundingBoxAscent }; inkC.set(k, v); }
  return { l: (v.l * s) / REF, r: (v.r * s) / REF, a: (v.a * s) / REF };
}
function layout(str, w, s, track = 0) {
  const chars = [...str], xs = [], advs = [];

  for (let i = 0; i < chars.length; i++) {
    xs.push(x);
    const a = adv(chars[i], w, s) + (i + 1 < chars.length ? kern(chars[i], chars[i + 1], w, s) + track : 0);
    advs.push(a);
    x += a;

}
function glyph(ctx, ch, x, y, w, s, color) {
  ctx.font = fnt(w, s);
  ctx.fillStyle = color;
  ctx.fillText(ch, x, y);
  rec(ctx, x, y); rec(ctx, x + s * 0.5, y - s * 0.7);
}
function text(ctx, str, x, y, w, s, color, track = 0) {
  const L = layout(str, w, s, track);
  for (let i = 0; i < L.chars.length; i++) if (L.chars[i] !== ' ') glyph(ctx, L.chars[i], x + L.xs[i], y, w, s, color);
  return L.width;
}
let CAP = 0.71;

/* ---------------------------------------------------------------- shapes */
function rrect(ctx, x, y, w, h, r, fill, stroke, lw) {
  if (w <= 0.01 || h <= 0.01) return;
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke && lw > 0.01) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }

}
function polyPath(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function rsqPoints(side, rad, rot, nArc = 12) {      // rounded square, clockwise (y down), from top-centre
  const h = side / 2, r = Math.min(Math.max(rad, 0.001), h);
  const pts = [[0, -h]];
  const corners = [[h - r, -h + r, -Math.PI / 2], [h - r, h - r, 0], [-h + r, h - r, Math.PI / 2], [-h + r, -h + r, Math.PI]];
  for (const [cx, cy, a0] of corners) for (let k = 0; k <= nArc; k++) {
    const a = a0 + (k / nArc) * (Math.PI / 2);
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);

}
function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i][0] * q[1] - q[0] * p[i][1]; } return a / 2; }
function tickPoints(S) {                               // a thick check mark, centred, clockwise (y down)
  const A = [-0.40 * S, 0.03 * S], B = [-0.13 * S, 0.30 * S], Cc = [0.43 * S, -0.30 * S], th = (0.2 * S) / 2;
  const nrm = (v) => { const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; };
  const d1 = nrm([B[0] - A[0], B[1] - A[1]]), d2 = nrm([Cc[0] - B[0], Cc[1] - B[1]]);
  const n1 = [-d1[1], d1[0]], n2 = [-d2[1], d2[0]];
  const m = nrm([n1[0] + n2[0], n1[1] + n2[1]]), ml = th / (m[0] * n1[0] + m[1] * n1[1]);
  let p = [
    [A[0] + n1[0] * th, A[1] + n1[1] * th], [B[0] + m[0] * ml, B[1] + m[1] * ml], [Cc[0] + n2[0] * th, Cc[1] + n2[1] * th],
    [Cc[0] - n2[0] * th, Cc[1] - n2[1] * th], [B[0] - m[0] * ml, B[1] - m[1] * ml], [A[0] - n1[0] * th, A[1] - n1[1] * th],
  ];
  if (polyArea(p) < 0) p.reverse();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const q of p) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;

}
function resample(pts, n, keepCorners) {              // closed polygon → n points evenly spaced by arc length
  const m = pts.length, L = [];
  let tot = 0;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % m]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(l); tot += l; }
  const out = [];
  if (keepCorners) {                                   // every vertex kept, the rest spread by edge length
    let left = n - m;
    const extra = L.map((l) => Math.floor((l / tot) * left));
    let used = extra.reduce((s, v) => s + v, 0), i = 0;
    while (used < left) { extra[i % m]++; used++; i++; }
    for (let k = 0; k < m; k++) {
      const a = pts[k], b = pts[(k + 1) % m], e = extra[k] + 1;
      for (let j = 0; j < e; j++) out.push([lerp(a[0], b[0], j / e), lerp(a[1], b[1], j / e)]);
    }
    return out;
  }
  let k = 0, acc = 0;
  for (let j = 0; j < n; j++) {
    const d = (j / n) * tot;
    while (acc + L[k] < d && k < m - 1) { acc += L[k]; k++; }
    const u = L[k] > 0 ? (d - acc) / L[k] : 0, a = pts[k], b = pts[(k + 1) % m];
    out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
  }
  return out;
}
function alignTo(src, ref) {                           // rotate src's index so it lines up with ref
  const n = src.length;
  let best = 0, bd = Infinity;
  for (let o = 0; o < n; o++) {
    let d = 0;
    for (let i = 0; i < n; i++) { const p = src[(i + o) % n], q = ref[i]; d += (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2; }
    if (d < bd) { bd = d; best = o; }

}
const lerpPoly = (a, b, u) => a.map((p, i) => [lerp(p[0], b[i][0], u), lerp(p[1], b[i][1], u)]);

/* ================================================================ LAYOUT CONSTANTS */
// End card. It is also frame 0: the loop seam sits inside the CTA.
const ECS = 1.4;                        // end-card scale: the CTA has to read on a phone
const EC = {
  head: 'Let’s automate your hiring.', hw: 700, hs: 96, hy: 468, track: -1.5,
  field: { x: 960 - 300 * ECS, y: 640 - 54 * ECS, w: 600 * ECS, h: 108 * ECS, r: 54 * ECS },
  pill: { x: 0, y: 640 - 54 * ECS, w: 0, h: 108 * ECS, r: 54 * ECS },   // width fitted to the CTA text in precompute()
  caret: { x: 960 - 254 * ECS, y: 640 - 21 * ECS, w: 4 * ECS, h: 42 * ECS, r: 2 * ECS },
  ph: { text: 'DM me – Ryan Ang', x: 960 - 236 * ECS, w: 500, s: 36 * ECS },
  cta: { w: 640, s: 40 * ECS },
};
// Bar 1: hook, typed inside the DM field after the camera dives into it.
const DIVE_Z = 11 / ECS, PIV = { x: 0, y: 0 };   // the dive lands on the same 44 x 462 px caret whatever ECS is
const HK = { x0: 250, fs: 396, w: 760, track: -4 };
const HOOK = [                          // a recruiter's loop, once per applicant
  { word: 'COPY', t0: 0.10, mode: 'type', dt: 0.045, sel: 0.36 },
  { word: 'PASTE', t0: 0.50, mode: 'paste', sel: 0.86 },
  { word: 'REPLY', t0: 1.00, mode: 'type', dt: 0.032, sel: 1.36 },
  { word: 'REPEAT', t0: 1.50, mode: 'paste', sel: null },
];
const FLOOD = { word: 'REPEAT', shrink: 1.56, s0: 1.61, s1: 1.80, selAll: 1.835, fs: 84, rows: 13, margin: 48, minGap: 34 };
// Bar 2: kinetic type.
const K2 = {
  fs: 228, lead: 212, x: 0, dt: 0.026, heavy: 900, light: 360,
  lines: [
    { text: 'WHAT IF', T: 2.0, ts: 2.12 },
    { text: 'HIRING', T: 2.5, ts: 2.55 },
    { text: 'RAN', T: 3.0, ts: 3.05 },
    { text: 'ITSELF?', T: 3.5, ts: 3.55, lime: true },
  ],
};
// Bar 3: the workflow line.
const TY = 560, TX0 = 200, TX1 = 1720, NX = [330, 750, 1170, 1590], TOK = 150;
const LAB = { y: TY + 166, s: 46, w: 640, track: 5, sub: 32, subW: 440, subDy: 54 };
const MOVES = [4.5, 5.0, 5.5];
const ARRIVE = [4.36, 4.8, 5.3, 5.8];
const LABELS = ['WHEN', 'IF', 'THEN', 'DONE'];
const SUBLABELS = ['a candidate applies', 'they fit the role', 'book the interview', 'no hands'];
// Bar 4–5: the machine, then the chart.
const TOKENS = { t0: 6.25, dt: 0.125, n: 8, v: 1400 };   // all absorbed into DONE by 8.0
const GROW = [{ t: 6.5, h: 140 }, { t: 7.0, h: 230 }, { t: 7.5, h: 330 }, { t: 7.75, h: 430 }];
const LENS = { f: 1500, dolly: 0.1, s5: 1.06, bar: 116, base: [272, 1648] };   // s5: chart scale after the dolly
const CARD = { x: 240, y: 135, w: 1440, h: 810, r: 36 };
const BASE5 = 820;
// Bar 6: one card becomes 4,096.
const SPLITS = [{ t: 10.0, d: 0.3 }, { t: 10.5, d: 0.3 }, { t: 11.0, d: 0.3 }, { t: 11.5, d: 0.22 }, { t: 11.75, d: 0.12 }, { t: 11.875, d: 0.1 }];
// Bar 7: mosaic.
const MOS = { lines: ['IT RUNS', 'ITSELF.'], w: 900, fs: 440, words: [{ t: 12.5 }, { t: 13.0 }, { t: 13.5 }] };

/* ================================================================ PRECOMPUTED GEOMETRY (built once, read-only) */
const G = {};
function precompute() {
  CAP = measure('H', 800).actualBoundingBoxAscent / REF;
  HK.cap = CAP * HK.fs; HK.base = 540 + HK.cap / 2;
  HK.cw = EC.caret.w * DIVE_Z; HK.ch = EC.caret.h * DIVE_Z;      // the end-card caret, seen from inside the field
  HK.gap = 258 - HK.x0;
  // zoom pivot that carries the end-card caret to its hook position (258, 540)
  const ax = EC.caret.x + EC.caret.w / 2, ay = EC.caret.y + EC.caret.h / 2;
  PIV.x = (HK.x0 + HK.gap - DIVE_Z * ax) / (1 - DIVE_Z); PIV.y = (540 - DIVE_Z * ay) / (1 - DIVE_Z);

  // end card: the CTA button hugs its text, centred
  const cw = inkWidth(layout(EC.ph.text, EC.cta.w, EC.cta.s), EC.cta.w, EC.cta.s);
  EC.pill.w = Math.max(310 * ECS, Math.round(cw + 2 * 56 * ECS)); EC.pill.x = 960 - EC.pill.w / 2;

  let wmax = 0;
  K2.lines.forEach((ln, i) => { const L = layout(ln.text, i === 3 ? K2.heavy : K2.light, K2.fs); wmax = Math.max(wmax, L.width); });
  K2.x = Math.round(960 - wmax / 2);

    alignTo(resample(rsqPoints(0.8 * TOK, 0.06 * TOK, Math.PI / 4), 64), SQ),
    alignTo(resample(rsqPoints(0.86 * TOK, 0.08 * TOK, 0), 64), SQ),
    alignTo(G.tick, SQ),

function measureDot(w, s) {

/* ================================================================ END CARD (bar 7½, and frame 0) */
function drawHeadline(ctx, scale) {
  const L = layout(EC.head, EC.hw, EC.hs, EC.track);

  ctx.translate(960, EC.hy - (CAP * EC.hs) / 2);
  ctx.scale(scale, scale);
